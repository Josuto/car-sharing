# Keeps one RabbitMQ pod running and restarts it on failure.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: car-sharing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:4-management
          ports:
            - containerPort: 5672
            - containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: guest
            - name: RABBITMQ_DEFAULT_PASS
              value: guest
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "ping"]
            initialDelaySeconds: 20
            periodSeconds: 10
---
# Gives RabbitMQ a stable DNS name ("rabbitmq") and virtual IP so other pods
# can reach it at rabbitmq:5672 regardless of pod restarts and IP changes.
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: car-sharing
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
