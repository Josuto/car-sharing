apiVersion: apps/v1
kind: Deployment
metadata:
  name: psp-stub
  namespace: car-sharing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: psp-stub
  template:
    metadata:
      labels:
        app: psp-stub
    spec:
      containers:
        - name: psp-stub
          image: car-sharing/psp-stub:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8085
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 40
            periodSeconds: 15
---
# Internal-only service — payments reaches it via http://psp-stub:8085.
apiVersion: v1
kind: Service
metadata:
  name: psp-stub
  namespace: car-sharing
spec:
  selector:
    app: psp-stub
  ports:
    - port: 8085
      targetPort: 8085
