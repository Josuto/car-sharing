# Keeps one gateway pod running and restarts it on failure.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: car-sharing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: car-sharing/gateway:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: car-sharing-config
          env:
            - name: OTEL_SERVICE_NAME
              value: gateway
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
---
# Exposes the gateway as the single cluster ingress point via NodePort.
# All external traffic enters through this service.
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: car-sharing
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
    - port: 8080
      targetPort: 8080
